services:
  - type: web
    name: emotion-detection-ai
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --preload
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0